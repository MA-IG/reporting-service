<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Generate Report</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body class="bg-light">

<div class="container py-5">

    <div class="mb-4">
        <a th:href="@{/}" class="text-decoration-none">
            &larr; Back to templates
        </a>
        <h2 class="mt-3">Generate Report</h2>
        <p class="text-muted">
            Select a report template, provide its parameters and data,
            then generate a PDF.
        </p>
    </div>

    <div class="card border-0 shadow-sm">
        <div class="card-body p-4">

            <form id="generateForm">

                <div class="mb-4">
                    <label for="reportName" class="form-label">
                        Report template
                    </label>

                    <select id="reportName" class="form-select" required>
                        <option value="">Select a template</option>

                        <option th:each="template : ${templates}"
                                th:value="${template.name}"
                                th:text="${template.name}">
                        </option>
                    </select>
                </div>

                <div class="mb-4">
                    <label for="parameters" class="form-label">
                        Parameters (JSON)
                    </label>

                    <textarea id="parameters"
                              class="form-control font-monospace"
                              rows="6"
                              spellcheck="false"
                              required>{
  "title": "My Report"
}</textarea>

                    <div class="form-text">
                        Use the parameter names declared in your JasperReports template.
                    </div>
                </div>

                <div class="mb-4">
                    <label for="data" class="form-label">
                        Data (JSON array)
                    </label>

                    <textarea id="data"
                              class="form-control font-monospace"
                              rows="10"
                              spellcheck="false"
                              required>[
  {
    "id": 1,
    "name": "Ahmed",
    "salary": 12000
  },
  {
    "id": 2,
    "name": "Sara",
    "salary": 15000
  }
]</textarea>

                    <div class="form-text">
                        Each object's keys must match the fields in the report template.
                    </div>
                </div>

                <div id="errorMessage"
                     class="alert alert-danger d-none"
                     role="alert"></div>

                <button type="submit"
                        id="generateButton"
                        class="btn btn-primary">
                    Generate PDF
                </button>

            </form>

        </div>
    </div>

</div>

<script>
    const form = document.getElementById('generateForm');
    const button = document.getElementById('generateButton');
    const errorMessage = document.getElementById('errorMessage');

    form.addEventListener('submit', async function (event) {
        event.preventDefault();

        errorMessage.classList.add('d-none');

        let parameters;
        let data;

        try {
            parameters = JSON.parse(
                document.getElementById('parameters').value
            );

            data = JSON.parse(
                document.getElementById('data').value
            );

            if (parameters === null ||
                typeof parameters !== 'object' ||
                Array.isArray(parameters)) {
                throw new Error('Parameters must be a JSON object.');
            }

            if (!Array.isArray(data)) {
                throw new Error('Data must be a JSON array.');
            }
        } catch (error) {
            errorMessage.textContent = 'Invalid JSON: ' + error.message;
            errorMessage.classList.remove('d-none');
            return;
        }

        const reportName = document.getElementById('reportName').value;

        if (!reportName) {
            errorMessage.textContent = 'Please select a report template.';
            errorMessage.classList.remove('d-none');
            return;
        }

        button.disabled = true;
        button.textContent = 'Generating...';

        try {
            const response = await fetch('/api/reports/generate', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Accept': 'application/pdf'
                },
                body: JSON.stringify({
                    reportName: reportName,
                    parameters: parameters,
                    data: data
                })
            });

            if (!response.ok) {
                const message = await response.text();
                throw new Error(
                    message || `Request failed (${response.status})`
                );
            }

            const blob = await response.blob();
            const url = URL.createObjectURL(blob);
            const link = document.createElement('a');

            link.href = url;
            link.download = reportName.replace(
                /[^a-zA-Z0-9._-]/g, '_'
            ) + '.pdf';

            document.body.appendChild(link);
            link.click();
            link.remove();

            URL.revokeObjectURL(url);

        } catch (error) {
            errorMessage.textContent =
                'Could not generate report: ' + error.message;
            errorMessage.classList.remove('d-none');
        } finally {
            button.disabled = false;
            button.textContent = 'Generate PDF';
        }
    });
</script>

</body>
</html>

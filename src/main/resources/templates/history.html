
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Report History</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">
</head>
<body class="bg-light">

<div class="container py-5">

  <div class="d-flex justify-content-between align-items-center mb-4">
    <div>
      <a th:href="@{/}" class="text-decoration-none">
        &larr; Back to templates
      </a>
      <h2 class="mt-3">Report History</h2>
      <p class="text-muted mb-0">
        Review previous generations and manage your favorites.
      </p>
    </div>
  </div>

  <div class="d-flex justify-content-between align-items-center mb-3">
        <span class="text-muted"
              th:text="${history.size()} + ' record(s)'"></span>

    <div class="btn-group">
      <a th:href="@{/history(filter='all')}"
         class="btn"
         th:classappend="${filter == 'all'} ? ' btn-primary' : ' btn-outline-primary'">
        All
      </a>

      <a th:href="@{/history(filter='favorites')}"
         class="btn"
         th:classappend="${filter == 'favorites'} ? ' btn-primary' : ' btn-outline-primary'">
        ★ Favorites
      </a>
    </div>
  </div>

  <div class="card border-0 shadow-sm">
    <div class="table-responsive">
      <table class="table table-hover align-middle mb-0">
        <thead class="table-light">
        <tr>
          <th>Report</th>
          <th>Generated at</th>
          <th>Favorite</th>
          <th class="text-end">Actions</th>
        </tr>
        </thead>

        <tbody>
        <tr th:each="item : ${history}">
          <td>
            <strong th:text="${item.reportName}"></strong>
            <div class="small text-muted"
                 th:text="'History ID: ' + ${item.id}"></div>
          </td>

          <td th:text="${#temporals.format(item.generatedAt, 'yyyy-MM-dd HH:mm:ss')}"></td>

          <td>
            <span th:if="${item.favorite}" class="text-warning">
                ★ Favorite
            </span>
                    <span th:unless="${item.favorite}" class="text-muted">
                —
            </span>
          </td>

          <td class="text-end">
            <form th:action="@{/history/{id}/favorite(id=${item.id})}"
                  method="post"
                  class="d-inline favorite-form"
                  th:attr="data-id=${item.id}">

              <input type="hidden" name="filter" th:value="${filter}">

              <button type="submit"
                          class="btn btn-sm"
                          th:classappend="${item.favorite}
                ? ' btn-warning'
                : ' btn-outline-secondary'"
                          th:text="${item.favorite}
                ? '★ Unfavorite'
                : '☆ Favorite'">
              </button>
              <a th:href="@{/history/{id}/regenerate(id=${item.id})}"
                 class="btn btn-sm btn-primary">
                Regenerate
              </a>
            </form>
          </td>
        </tr>

        <tr th:if="${#lists.isEmpty(history)}">
          <td colspan="4" class="text-center text-muted py-5">
            No report history found.
          </td>
        </tr>
        </tbody>
      </table>
    </div>
  </div>

</div>
</body>
</html>
